<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Anika Tabassum: Pixel Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
:root{--night:#1D1740;--night2:#2B2260;--paper:#FFF3D6;--ink:#241B4D;--gold:#FFC83D;--pink:#D6457A;--teal:#2BB3A3;--sky:#8FD3F4;--card:#FFE7A8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#2B2260;--ink:#FFF3D6;--card:#3A2E7A}}
:root[data-theme="dark"]{--paper:#2B2260;--ink:#FFF3D6;--card:#3A2E7A}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--night);color:#FFF3D6;font-family:'VT323',ui-monospace,Menlo,monospace;font-size:22px;line-height:1.25;
background-image:radial-gradient(var(--night2) 2px,transparent 2px);background-size:24px 24px;min-height:100%}
h1,h2,h3,button,.px-font{font-family:'Press Start 2P',ui-monospace,Menlo,monospace;font-weight:400}
.wrap{max-width:860px;margin:0 auto;padding:14px 14px 28px}
.hud{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center;justify-content:space-between;margin-bottom:16px}
h1{font-size:18px;margin:0 0 6px;color:var(--gold);text-shadow:3px 3px 0 var(--pink)}
.brand p{margin:0;color:var(--sky)}
.stats{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.bar{width:140px;height:16px;border:3px solid var(--gold);background:var(--ink)}
.bar i{display:block;height:100%;width:0;background:var(--teal);transition:width .4s steps(8)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
button{font-size:10px;padding:10px 12px;border:3px solid var(--ink);background:var(--gold);color:var(--ink);cursor:pointer;box-shadow:0 4px 0 var(--pink);transform:translateY(0)}
button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--pink)}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,canvas:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.frame{border:4px solid var(--ink);box-shadow:0 0 0 4px var(--gold),8px 8px 0 4px rgba(0,0,0,.4);background:#5BBF6A;line-height:0}
canvas{width:100%;height:auto;image-rendering:pixelated;image-rendering:crisp-edges;display:block;touch-action:none}
.warp{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0 8px;align-items:center}
.warp span{color:var(--sky)}
.hint{color:var(--sky);margin:10px 0 0}
.pad{display:none;grid-template-columns:repeat(3,56px);grid-template-rows:repeat(2,56px);gap:6px;justify-content:center;margin:14px auto 0;touch-action:none}
.pad button{font-size:16px;padding:0;width:56px;height:56px}
.pad .u{grid-column:2;grid-row:1}.pad .l{grid-column:1;grid-row:2}.pad .d{grid-column:2;grid-row:2}.pad .r{grid-column:3;grid-row:2}
.pad .a{grid-column:3;grid-row:1;background:var(--pink);color:#fff}
@media (pointer:coarse){.pad{display:grid}}
dialog{width:min(640px,calc(100vw - 24px));max-height:calc(100vh - 40px);padding:0;border:4px solid var(--ink);background:var(--paper);color:var(--ink);box-shadow:0 0 0 4px var(--gold),8px 8px 0 4px rgba(0,0,0,.45);overflow:auto}
dialog::backdrop{background:rgba(29,23,64,.8)}
.dh{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px;background:var(--pink);color:#fff;position:sticky;top:0}
.dh h2{font-size:14px;margin:0}
.dh button{background:var(--paper)}
.db{padding:16px 18px 20px}
.db p{margin:0 0 12px}
h3{font-size:12px;margin:0 0 8px}
.stat{display:grid;grid-template-columns:110px 1fr 44px;gap:10px;align-items:center;margin:8px 0}
.stat .b{height:14px;border:3px solid var(--ink);background:var(--paper)}
.stat .b i{display:block;height:100%;background:var(--teal)}
.card{border:3px solid var(--ink);background:var(--card);padding:12px 14px;margin:0 0 14px;box-shadow:4px 4px 0 var(--ink)}
.card h3{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.tag{display:inline-block;background:var(--gold);color:#241B4D;border:2px solid #241B4D;padding:0 6px;margin:0 6px 6px 0}
.boss{color:var(--pink)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 14px}
.row a,.send{font-family:'Press Start 2P',monospace;font-size:10px;padding:10px 12px;border:3px solid var(--ink);background:var(--gold);color:#241B4D;text-decoration:none;box-shadow:0 4px 0 var(--pink);display:inline-block}
label{display:block;margin:8px 0 2px}
input,textarea{width:100%;font:inherit;font-size:22px;padding:6px 8px;border:3px solid var(--ink);background:var(--paper);color:var(--ink)}
.tl{border-left:4px solid var(--ink);padding-left:14px;margin:0 0 6px}
.tl p{margin:0 0 10px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,40px);opacity:0;background:var(--gold);color:#241B4D;border:3px solid #241B4D;padding:10px 14px;font-family:'Press Start 2P',monospace;font-size:10px;pointer-events:none;transition:.25s steps(4);z-index:9;text-align:center}
#toast.on{transform:translate(-50%,0);opacity:1}
#plain section{background:var(--paper);color:var(--ink);border:4px solid var(--ink);box-shadow:0 0 0 4px var(--gold);margin:0 0 24px}
#plain section>h2{background:var(--pink);color:#fff;font-size:14px;margin:0;padding:14px 16px}
.ql{margin:20px 0 0;border:4px solid var(--gold);background:var(--night2);padding:12px 14px}.ql h3{font-size:11px;color:var(--gold);margin:0 0 8px}.ql ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:2px 14px}.ql .ok{color:var(--teal);text-decoration:line-through}
.rgb{min-width:140px}
@media (prefers-reduced-motion:reduce){.bar i,#toast{transition:none}}
@media (max-width:520px){body{font-size:20px}h1{font-size:14px}.stat{grid-template-columns:90px 1fr 38px}}
</style>
</head>
<body>
<div class="wrap">
<header class="hud">
 <div class="brand"><h1>ANIKA TABASSUM</h1><p>CSE student. Builds AI projects and user-friendly apps.</p></div>
 <div class="stats"><span id="lvl" class="px-font" style="font-size:10px"></span><div class="bar" title="Experience"><i id="xp"></i></div><span id="found"></span></div>
 <div class="btns"><button id="snd" aria-pressed="true">Sound: on</button><button id="dn" aria-pressed="false">Night: off</button><button id="wx">Weather: clear</button><button id="mu" aria-pressed="false">Music: off</button><button id="ou">Outfit</button><button id="tr">Trophies</button><button id="skip">Skip game</button></div>
</header>

<main id="game">
 <div class="frame"><canvas id="cv" width="320" height="192" tabindex="0" aria-label="Pixel village. Walk to a door to open a section."></canvas></div>
 <nav class="warp" aria-label="Fast travel"><span>Warp to:</span></nav>
 <p class="hint">Arrow keys to walk. E, Space or Enter to open a door. Esc to close.</p>
 <div class="pad" aria-label="On-screen controls">
  <button class="u" data-d="up" aria-label="Up">&#9650;</button><button class="a" id="abtn" aria-label="Open door (E)">E</button>
  <button class="l" data-d="left" aria-label="Left">&#9664;</button><button class="d" data-d="down" aria-label="Down">&#9660;</button><button class="r" data-d="right" aria-label="Right">&#9654;</button>
 </div>
 <aside class="ql" id="ql"></aside>
</main>

<main id="plain" hidden></main>
</div>

<dialog id="dlg" aria-labelledby="dt"><div class="dh"><h2 id="dt"></h2><button id="dx">Close</button></div><div class="db" id="db"></div></dialog>
<div id="toast" role="status" aria-live="polite"></div>

<script>
/* ---------- Editable content ---------- */
const ME={name:'Anika Tabassum',email:'tabassumanika558@gmail.com',github:'https://github.com/Anikatabassum-bt'};
const SECTIONS={
 about:{title:'The Cottage: About',html:()=>`
  <img src="${PIC}" alt="Portrait of Anika" width="88" height="88" style="float:left;margin:2px 14px 8px 0;border:4px solid var(--ink);box-shadow:4px 4px 0 var(--pink);background:var(--gold)"><p>Hi, I'm Anika. I'm a final-year BSc student in Computer Science and Engineering at BRAC University, interested in software development, AI and user-centered design.</p>
  <p>I enjoy collaborating on academic projects and designing digital content. I'm a quick learner who cares about building reliable, user-focused applications. I also create social media content for Instagram and Facebook.</p>
  <h3>Right now</h3>
  <div class="tl"><p>Working on my final year research project: a research paper and software, covering research, documentation and collaborative development.</p></div>
  <h3>Languages</h3>
  <p><span class="tag">Bengali (native)</span><span class="tag">English (fluent)</span><span class="tag">Hindi (fluent)</span><span class="tag">Spanish (elementary)</span></p>`},
 projects:{title:'The Shop: Projects',html:()=>plistHtml()},
 skills:{title:'The Tower: Skills',html:()=>SKILLTREE.map(g=>`<div class="card"><h3>${g[0]}</h3><div>${g[1].map(t=>`<span class="tag">${t}</span>`).join('')}</div></div>`).join('')},
 hobbies:{title:'The Arcade: Hobbies',html:()=>`
  ${[['Social media content','I create posts and visuals for Instagram and Facebook.'],['Graphic design and video editing','Canva, Figma and Framer for visuals, short videos and layouts.'],['Creative writing','Captions, stories and report writing.'],['Webcam experiments','Playful browser toys like Web-Shooter and Neon-Hand-Trails.']].map(h=>`<div class="card"><h3>${h[0]}</h3><p>${h[1]}</p></div>`).join('')}
  <h3>Not sure what to ask me about?</h3>
  <p><button type="button" onclick="rollHobby()">Roll the dice</button></p><p class="boss roll" aria-live="polite"></p><h3 style="margin-top:14px">Reaction test</h3><p><button type="button" class="rgb" onclick="rg()">Start</button></p><p class="rgmsg" aria-live="polite">Press start, wait for the signal, then press the button.</p>`},
 secret:{title:'Secret chest',html:()=>`<p>You found the hidden chest. Inside: a gold coin, a rubber duck, and a note.</p><p class="boss"><b>Note:</b> The best portfolios have one thing nobody asked for. Thanks for looking this closely.</p><p>Cheat code for recruiters: <b>HIRE-ME-2026</b>. Effect: +1 team morale.</p>`},
 trophies:{title:'Trophy case',html:()=>Object.keys(TR).map(k=>`<div class="card"><h3><span>${TR[k][0]}</span><span>${got.has(k)?'Earned':'Locked'}</span></h3><p>${TR[k][1]}</p></div>`).join('')},
 blog:{title:'The Library: Learning',html:()=>`<h3>Education</h3>${[['B.Sc. in Computer Science and Engineering','2022 to present','BRAC University'],['Higher Secondary Certificate','2019 to 2021','Dhaka Commerce College. Science group'],['Secondary School Certificate','2019','Biam Laboratory School, Naogaon. Science group']].map(e=>`<div class="card"><h3><span>${e[0]}</span><span>${e[1]}</span></h3><p>${e[2]}</p></div>`).join('')}<h3>Certifications</h3><div class="card"><p>${['AI for Business Professionals (HP LIFE)','Agile Project Management (HP LIFE)','Business Communications (HP LIFE)','Data Science and Analytics (HP LIFE)','Content Hub Software Certification (HubSpot Academy)'].map(c=>'<span class="tag">'+c+'</span>').join('')}</p></div>`},
 garden:{title:'The Garden: Focus timer',html:()=>`<p>A tiny nod to my Pomodoro Garden Timer, a browser-based focus timer. Pick a length and start.</p><p class="px-font" id="tm" style="font-size:28px;margin:10px 0">25:00</p><div class="row"><button type="button" onclick="tmSet(5)">5 min</button><button type="button" onclick="tmSet(25)">25 min</button><button type="button" id="tgo" onclick="tmGo()">Start</button><button type="button" onclick="tmSet(tmMin)">Reset</button></div>`,after(){tmShow()}},
 npc:{title:'Pip the villager',html:()=>{const nm={about:'the cottage',skills:'the tower',projects:'the shop',hobbies:'the arcade',contact:'the mailbox',blog:'the library, far to the east'},left=PLACES.filter(p=>!seen.has(p));return `<p>Hello, traveler! I'm Pip.</p><p>${left.length?'You have not visited '+nm[left[0]]+' yet. Go and take a look!':'You have seen every building. Nice work!'}</p><p>Tips: the road goes on to the east, there is a park out there, and the N key makes it night.</p>`}},
 outfit:{title:'Wardrobe',html:()=>`<h3>Shirt</h3><div class="row">${SHIRTS.map(c=>`<button type="button" style="background:${c};width:46px;height:46px" aria-label="Shirt ${c}" onclick="setLook('shirt','${c}')"></button>`).join('')}</div><h3>Hat</h3><div class="row">${['none','cap','crown','wizard'].map(h=>`<button type="button" onclick="setLook('hat','${h}')">${h}</button>`).join('')}</div><p>Your look updates in the village right away.</p>`},
 map:{title:'Treasure map',html:()=>`<svg viewBox="0 0 400 120" width="100%" role="img" aria-label="Map of the village with a few question marks" style="border:3px solid var(--ink);background:#F2D388;display:block"><rect x="10" y="50" width="380" height="20" fill="#E3BF6B"/><rect x="90" y="70" width="20" height="40" fill="#E3BF6B"/><rect x="20" y="20" width="40" height="30" fill="#D6457A"/><rect x="80" y="10" width="30" height="40" fill="#2BB3A3"/><rect x="140" y="20" width="40" height="30" fill="#FFC83D"/><rect x="60" y="70" width="30" height="20" fill="#3B6FD4"/><rect x="20" y="80" width="30" height="20" fill="#4FB6E8"/><g fill="#D6457A" font-family="monospace" font-size="26" text-anchor="middle"><text x="150" y="104">?</text><text x="262" y="100">?</text><text x="352" y="104">?</text></g></svg><p style="margin-top:12px">Somewhere quiet, away from the road. Keep an eye out for a glint in the grass.</p>`},
 score:{title:'Scoreboard',html:()=>`<div class="card"><h3><span>Best reaction</span><span>${best?best+' ms':'none yet'}</span></h3><p>Beat 350 ms in the arcade to finish that quest.</p></div><div class="card"><h3><span>Steps walked</span><span>${P.step}</span></h3></div><div class="card"><h3><span>Places found</span><span>${seen.size}/${PLACES.length}</span></h3></div><div class="card"><h3><span>Trophies</span><span>${got.size}/${Object.keys(TR).length}</span></h3></div><p>Scores are saved in this browser only.</p>`},
 contact:{title:'The Mailbox: Contact',html:()=>`
  <p>Get in touch about projects, collaborations or opportunities.</p>
  <div class="row"><a href="${ME.github}" target="_blank" rel="noopener">GitHub</a><button type="button" id="copy">Copy email</button></div>
  <h3>Send a message</h3>
  <label for="fn">Your name</label><input id="fn" autocomplete="name">
  <label for="fm">Message</label><textarea id="fm" rows="4"></textarea>
  <div class="row" style="margin-top:12px"><a class="send" href="https://mail.google.com/mail/?view=cm&fs=1&to=${ME.email}" target="_blank" rel="noopener" onclick="mailGo('gmail',this)">Open in Gmail</a><a class="send" href="mailto:${ME.email}" onclick="mailGo('mailto',this)">Open in email app</a><button type="button" onclick="copyMsg(mailData(this.closest('.db')),false)">Copy message</button></div><p>These open a draft with your message already written. Press send there to deliver it. If nothing opens, copy the message and email it to ${ME.email}.</p>`,
  after(){q('#copy').onclick=async()=>{try{await navigator.clipboard.writeText(ME.email);toast('Email copied')}catch(e){toast(ME.email)}}}}
};
const PROJ=[
   ['Legality','Live website','A live website for Legality, a corporate law firm in Dhaka.',['Website','Live','Client work'],'','https://legalitybd.com/'],
   ['AgenticMeet','Group project','An AI-driven, real-time conversational video conference SaaS platform.',['AI','Speech-to-text','SaaS'],''],
   ['Blood-Donor-Finder','Group Project','A system that helps healthcare institutions and individuals find blood donors.',['Healthcare','Search'],''],
   ['Customer-Category-Classifier','Academic','A machine learning project that analyzes a customer dataset and builds classification models to predict customer categories.',['Machine learning','Classification'],''],
   ['Web-Shooter','Personal','A single-file browser app that turns your webcam into a Spider-Man style web shooter.',['Webcam','Browser app'],''],
   ['Neon-Hand-Trails','Personal','Real-time webcam hand tracking that paints glowing neon energy trails as you move your fingertips.',['Hand tracking','Real-time'],''],
   ['Pomodoro Garden Timer','Personal','A browser-based focus timer. Try a tiny version in the garden.',['Browser app','Productivity'],''],
   ['Travel Agency Website','Personal','A website for a travel agency, showcasing tours and destinations.',['Website','Travel'],''],
   ['BAKI','App','An app that keeps track of money people owe each other.',['App','Reminders','Money tracking'],'']
  ];
const SKILLTREE=[['Creative and digital',['Creative writing','UI/UX design','Graphic design','Video editing','Report writing','Basic digital marketing','Social media content']],['Programming',['Python','SQL','C (basic)']],['Web',['HTML (basic)','CSS (basic)','JavaScript (basic)']],['Software and tools',['Canva','Figma','Framer','Git','GitHub','Microsoft Word','Microsoft PowerPoint','Microsoft Excel','Google Docs','Google Slides']]];
